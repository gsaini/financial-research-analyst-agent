repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        args: ["--line-length=100"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--select=E9,F63,F7,F82", "--statistics"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c "export OPENAI_API_KEY='sk-dummy' && export FMP_API_KEY='dummy' && pytest tests/ -k 'not integration' -W ignore::pydantic.warnings.PydanticDeprecatedSince20 -W ignore::DeprecationWarning"
        language: system
        pass_filenames: false
        always_run: true
